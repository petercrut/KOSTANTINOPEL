<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      try {
        var m = localStorage.getItem('kol-theme');
        if (m !== 'dark' && m !== 'light') {
          m = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', m);
        document.documentElement.style.colorScheme = m;
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <title>Masuk — Kostantinopel</title>
  <meta name="description" content="Masuk ke panel Kostantinopel untuk mengelola properti, kamar, penyewa, booking, dan pembayaran.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234F46E5'/%3E%3Cpath d='M6.5 11.5 12 6.5l5.5 5M8.5 10.5V18h7v-7.5' stroke='white' stroke-width='1.8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body class="auth-body">
  <div class="auth-theme">
    <button class="theme-switch" type="button" data-theme-toggle role="switch" aria-checked="false" aria-label="Mode gelap" title="Ubah mode terang/gelap">
      <span class="ts-track">
        <svg class="ts-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="ts-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        <span class="ts-knob"></span>
      </span>
    </button>
  </div>
  <div class="auth-card">
    <div class="auth-brand">
      <span class="brand-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 11.5 12 6.5l5.5 5"/><path d="M8.5 10.5V18h7v-7.5"/></svg>
      </span>
      <span>Kostantinopel</span>
    </div>
    <h1>Masuk ke Akun Anda</h1>
    <p class="auth-sub">Kelola properti, kamar, penyewa, dan pembayaran dalam satu panel.</p>

    <div class="auth-error" id="error-box"></div>

    <form id="login-form" novalidate>
      <label class="form-field">
        <span class="form-label">Email</span>
        <input type="email" id="email" name="email" placeholder="nama@email.com" autocomplete="email" required>
      </label>
      <label class="form-field">
        <span class="form-label">Password</span>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
      </label>
      <button type="submit" class="btn btn-primary btn-block" id="btn-submit">Masuk</button>
    </form>

    <div class="auth-alt">Belum punya akun? <a href="register.html">Daftar gratis</a></div>

    <div class="auth-demo">
      <strong>Akun demo:</strong><br>
      Admin/pemilik: admin@kostantinopel.id · admin123
      <a data-demo="admin">Isi</a><br>
      Penyewa: siti@kostantinopel.id · siti123
      <a data-demo="tenant">Isi</a>
    </div>
  </div>

  <script src="assets/js/utils.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/db.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    (function () {
      var U = KOL.utils;

      // Bersihkan hash sisa redirect dari app.html (cth: #/dashboard)
      if (location.hash) history.replaceState(null, '', location.pathname);

      // Jika sudah login, langsung ke aplikasi
      if (KOL.auth.isLoggedIn()) {
        window.location.href = 'app.html';
        return;
      }

      var form = document.getElementById('login-form');
      var errorBox = document.getElementById('error-box');
      var btn = document.getElementById('btn-submit');

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        errorBox.classList.remove('show');
        var email = document.getElementById('email').value.trim();
        var password = document.getElementById('password').value;
        if (!email || !password) {
          errorBox.textContent = 'Email dan password wajib diisi.';
          errorBox.classList.add('show');
          return;
        }
        btn.disabled = true;
        btn.textContent = 'Memproses...';
        KOL.auth.login(email, password).then(function (res) {
          btn.disabled = false;
          btn.textContent = 'Masuk';
          if (!res.ok) {
            errorBox.textContent = res.error;
            errorBox.classList.add('show');
            return;
          }
          U.toast('Selamat datang kembali!', 'success');
          setTimeout(function () { window.location.href = 'app.html'; }, 400);
        });
      });

      var demos = {
        admin: { email: 'admin@kostantinopel.id', password: 'admin123' },
        tenant: { email: 'siti@kostantinopel.id', password: 'siti123' }
      };
      U.qsa('[data-demo]').forEach(function (link) {
        link.addEventListener('click', function () {
          var demo = demos[link.getAttribute('data-demo')];
          if (!demo) return;
          document.getElementById('email').value = demo.email;
          document.getElementById('password').value = demo.password;
          document.getElementById('password').focus();
        });
      });
    })();
  </script>
</body>
</html>
