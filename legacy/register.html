<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      try {
        var m = localStorage.getItem('kol-theme');
        if (m !== 'dark' && m !== 'light') {
          m = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', m);
        document.documentElement.style.colorScheme = m;
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <title>Daftar — Kostantinopel</title>
  <meta name="description" content="Buat akun Kostantinopel gratis dan mulai kelola properti, kamar, penyewa, booking, dan pembayaran.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234F46E5'/%3E%3Cpath d='M6.5 11.5 12 6.5l5.5 5M8.5 10.5V18h7v-7.5' stroke='white' stroke-width='1.8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body class="auth-body">
  <div class="auth-theme">
    <button class="theme-switch" type="button" data-theme-toggle role="switch" aria-checked="false" aria-label="Mode gelap" title="Ubah mode terang/gelap">
      <span class="ts-track">
        <svg class="ts-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="ts-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        <span class="ts-knob"></span>
      </span>
    </button>
  </div>
  <div class="auth-card">
    <div class="auth-brand">
      <span class="brand-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 11.5 12 6.5l5.5 5"/><path d="M8.5 10.5V18h7v-7.5"/></svg>
      </span>
      <span>Kostantinopel</span>
    </div>
    <h1>Buat Akun Gratis</h1>
    <p class="auth-sub" id="auth-sub">Mulai kelola properti Anda dalam hitungan menit.</p>

    <div class="auth-error" id="error-box"></div>

    <form id="register-form" novalidate>
      <label class="form-field">
        <span class="form-label">Daftar Sebagai</span>
        <select id="role" name="role">
          <option value="admin">Admin / Pemilik Properti</option>
          <option value="tenant">Penyewa</option>
        </select>
        <small class="form-hint" id="role-hint">Kelola properti, kamar, penyewa, dan pembayaran.</small>
      </label>
      <label class="form-field" id="name-field">
        <span class="form-label">Nama Lengkap</span>
        <input type="text" id="name" name="name" placeholder="cth: Budi Santoso" autocomplete="name">
      </label>
      <label class="form-field">
        <span class="form-label">Email</span>
        <input type="email" id="email" name="email" placeholder="nama@email.com" autocomplete="email" required>
      </label>
      <div class="form-row">
        <label class="form-field">
          <span class="form-label">Password</span>
          <input type="password" id="password" name="password" placeholder="Minimal 6 karakter" autocomplete="new-password" required>
        </label>
        <label class="form-field">
          <span class="form-label">Ulangi Password</span>
          <input type="password" id="password2" name="password2" placeholder="Ulangi password" autocomplete="new-password" required>
        </label>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="btn-submit">Daftar Sekarang</button>
    </form>

    <div class="auth-alt">Sudah punya akun? <a href="login.html">Masuk di sini</a></div>
  </div>

  <script src="assets/js/utils.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/db.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    (function () {
      var U = KOL.utils;

      if (KOL.auth.isLoggedIn()) {
        window.location.href = 'app.html';
        return;
      }

      var form = document.getElementById('register-form');
      var errorBox = document.getElementById('error-box');
      var btn = document.getElementById('btn-submit');
      var roleSelect = document.getElementById('role');
      var nameField = document.getElementById('name-field');
      var roleHint = document.getElementById('role-hint');
      var authSub = document.getElementById('auth-sub');

      roleSelect.addEventListener('change', function () {
        var isTenant = roleSelect.value === 'tenant';
        nameField.style.display = isTenant ? 'none' : '';
        authSub.textContent = isTenant
          ? 'Masuk ke portal penyewa untuk pembayaran, kamar, dan laporan.'
          : 'Mulai kelola properti Anda dalam hitungan menit.';
        roleHint.textContent = isTenant
          ? 'Gunakan email yang sudah didaftarkan pengelola sebagai data penyewa.'
          : 'Kelola properti, kamar, penyewa, dan pembayaran.';
      });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        errorBox.classList.remove('show');

        var role = roleSelect.value;
        var name = document.getElementById('name').value.trim();
        var email = document.getElementById('email').value.trim();
        var password = document.getElementById('password').value;
        var password2 = document.getElementById('password2').value;

        function fail(msg) {
          errorBox.textContent = msg;
          errorBox.classList.add('show');
        }
        if (role === 'admin' && !name) return fail('Nama lengkap wajib diisi.');
        if (!email || email.indexOf('@') === -1) return fail('Masukkan email yang valid.');
        if (password.length < 6) return fail('Password minimal 6 karakter.');
        if (password !== password2) return fail('Ulangi password tidak cocok.');

        btn.disabled = true;
        btn.textContent = 'Memproses...';
        KOL.auth.register({ name: name, email: email, password: password, role: role }).then(function (res) {
          btn.disabled = false;
          btn.textContent = 'Daftar Sekarang';
          if (!res.ok) {
            fail(res.error);
            return;
          }
          U.toast(res.role === 'tenant' ? 'Akun penyewa berhasil dibuat.' : 'Akun berhasil dibuat. Selamat datang!', 'success');
          setTimeout(function () { window.location.href = 'app.html'; }, 400);
        });
      });
    })();
  </script>
</body>
</html>
