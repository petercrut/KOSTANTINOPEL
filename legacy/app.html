<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      try {
        var m = localStorage.getItem('kol-theme');
        if (m !== 'dark' && m !== 'light') {
          m = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', m);
        document.documentElement.style.colorScheme = m;
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <title>Kostantinopel — Panel Manajemen</title>
  <meta name="description" content="Panel manajemen co-living: properti, kamar, penyewa, booking, tagihan, dan laporan.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234F46E5'/%3E%3Cpath d='M6.5 11.5 12 6.5l5.5 5M8.5 10.5V18h7v-7.5' stroke='white' stroke-width='1.8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="app-body">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 11.5 12 6.5l5.5 5"/><path d="M8.5 10.5V18h7v-7.5"/></svg>
      </span>
      <div>
        <strong>Kostantinopel</strong>
        <small>Manajemen Co-Living</small>
      </div>
      <button class="nav-collapse" id="nav-collapse" title="Kecilkan / besar navbar" aria-label="Kecilkan navbar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 17l-5-5 5-5"/><path d="M18 17l-5-5 5-5"/></svg>
      </button>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-footer">
      <div class="sidebar-user" id="user-box"></div>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <div class="main">
    <header class="topbar">
      <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Menu">☰</button>
      <h1 id="page-title">Dashboard</h1>
      <div class="topbar-right">
        <span class="topbar-date" id="topbar-date"></span>
        <button class="theme-switch" type="button" data-theme-toggle role="switch" aria-checked="false" aria-label="Mode gelap" title="Ubah mode terang/gelap">
          <span class="ts-track">
            <svg class="ts-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="ts-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
            <span class="ts-knob"></span>
          </span>
        </button>
        <button class="btn btn-ghost btn-sm" id="btn-logout">Keluar</button>
      </div>
    </header>
    <main id="view" class="view"></main>
  </div>

  <script src="assets/js/utils.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/db.js"></script>

  <script src="assets/js/views/rooms.js"></script>
  <script src="assets/js/views/tenants.js"></script>
  <script src="assets/js/views/bookings.js"></script>
  <script src="assets/js/views/invoices.js"></script>
  <script src="assets/js/views/tenant-dashboard.js"></script>
  <script src="assets/js/views/my-room.js"></script>
  <script src="assets/js/views/payments.js"></script>
  <script src="assets/js/views/identity.js"></script>
  <script src="assets/js/views/requests.js"></script>
  <script src="assets/js/views/announcements.js"></script>
  <script src="assets/js/views/reports.js"></script>
  <script src="assets/js/views/settings.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.getElementById('topbar-date').textContent =
      new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  </script>
</body>
</html>
